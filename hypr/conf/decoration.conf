# See https://wiki.hyprland.org/Configuring/Variables/ for more
decoration {
	rounding = 6
	active_opacity = 1.00
	inactive_opacity = 1.00
	
    blur {
        enabled = true 
        size = 5
        passes = 2
        ignore_opacity = false 
        popups = true
        new_optimizations = true
    }
    
    shadow {
        enabled = true
        range = 15
        render_power = 12
        color = 0x66000000
    }
}

layerrule = blur, waybar 
layerrule = blur, notifications
layerrule = blur, *
