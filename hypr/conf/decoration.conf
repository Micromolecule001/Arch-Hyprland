# See https://wiki.hyprland.org/Configuring/Variables/ for more
decoration {
	rounding = 0
	active_opacity = 1.00
	inactive_opacity = 0.95
	
    blur {
        enabled = false
        size = 10
        passes = 3
        ignore_opacity = false 
        popups = true
        new_optimizations = true
    }
    
    shadow {
        enabled = false 
        range = 20
        render_power = 3
        color = 0x66000000
    }
}

layerrule = blur, waybar 
layerrule = blur, notifications
layerrule = blur, *
